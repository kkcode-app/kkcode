version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      expo:
        patterns:
          - "expo*"
          - "@expo/*"
      react:
        patterns:
          - "react"
          - "react-*"
          - "@react-*"
      types:
        patterns:
          - "@types/*"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
